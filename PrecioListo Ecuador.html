<script>/* Fórmulas puras de PrecioListo (sin DOM). Porcentajes en 0-100. */
const PL=(()=>{
const ok=(...a)=>a.every(x=>Number.isFinite(x)&&x>=0);
const E=m=>({error:m});
function price(o){const{compra=0,empaque=0,transporte=0,otros=0,comision=0,margen=0,descuento=0}=o;
 if(!ok(compra,empaque,transporte,otros,comision,margen,descuento))return E('Usa solo números válidos y no negativos.');
 if(margen+comision>=100)return E('El margen más la comisión debe ser menor a 100 %.');
 if(descuento>=100)return E('El descuento debe ser menor a 100 %.');
 const costo=compra+empaque+transporte+otros,c=comision/100,m=margen/100;
 const precio=costo/(1-m-c),com=precio*c,ganancia=precio-costo-com;
 const final=precio*(1-descuento/100),gD=final-costo-final*c;
 return{costo,precio,comisionUnit:com,ganancia,margen:precio?ganancia/precio:0,recargo:costo?ganancia/costo:null,final,gananciaDesc:gD,margenDesc:final?gD/final:0}}
function profit(o){const{precio=0,costo=0,cantidad=0,gastos=0,comision=0}=o;
 if(!ok(precio,costo,cantidad,gastos,comision))return E('Usa solo números válidos y no negativos.');
 if(comision>=100)return E('La comisión debe ser menor a 100 %.');
 const ing=precio*cantidad,cos=costo*cantidad,com=ing*comision/100,bruta=ing-cos,neta=bruta-gastos-com;
 return{ingresos:ing,costos:cos,comisiones:com,gastos,bruta,neta,margen:ing?neta/ing:0,porUnidad:cantidad?neta/cantidad:0}}
function breakeven(o){const{fijos=0,precio=0,variable=0}=o;
 if(!ok(fijos,precio,variable))return E('Usa solo números válidos y no negativos.');
 const cm=precio-variable;if(cm<=0)return E('El precio debe ser mayor al costo variable por unidad.');
 const u=Math.ceil(fijos/cm);
 return{contribucion:cm,unidades:u,ventas:u*precio,tabla:[0.5,1,1.5,2].map(k=>{const q=Math.max(1,Math.round(u*k));return{q,ganancia:q*cm-fijos}})}}
return{price,profit,breakeven}})();
if(typeof module!=='undefined')module.exports=PL;
</script><script>const $=s=>document.querySelector(s),app=$('#app');

if(t==='precio')b=priceCalc();
else if(t==='ganancias'){live('#gf',()=>{const r=PL.profit({precio:val('g1'),costo:val('g2'),cantidad:val('g3'),gastos:val('g4'),comision:val('g5')});if(r.error)return err(r.error);const mx=Math.max(r.ingresos,r.costos+r.gastos+r.comisiones,1);
return `<div class="res"><small>Ganancia neta estimada</small><div class="big">${usd(r.neta)}</div>${kv('Ingresos totales',usd(r.ingresos))}${kv('Costos totales (producto)',usd(r.costos))}${kv('Ganancia bruta',usd(r.bruta))}${kv('Margen de ganancia',pc(r.margen))}${kv('Ganancia por unidad',usd(r.porUnidad))}${bar('Ingresos',r.ingresos,mx)}${bar('Costos',r.costos,mx,'r')}${bar('Gastos+comis.',r.gastos+r.comisiones,mx,'r')}${bar('Ganancia neta',Math.max(0,r.neta),mx)}</div><p><small>Ganancia neta = ingresos − costo del producto − gastos adicionales − comisiones. Es una estimación: no incluye impuestos.</small></p>`});
b=`<div class="panel" id="gf"><div class="form">${fld('g1','Precio de venta ($)','5')}${fld('g2','Costo del producto ($)','3')}${fld('g3','Cantidad vendida','100')}${fld('g4','Gastos adicionales ($)','50')}${fld('g5','Comisiones (%)','0')}</div><div id="out"></div></div>`}
else{live('#ef',()=>{const r=PL.breakeven({fijos:val('e1'),precio:val('e2'),variable:val('e3')});if(r.error)return err(r.error);
return `<div class="res"><small>Para cubrir tus costos debes vender</small><div class="big">${r.unidades} unidades</div>${kv('Ventas necesarias',usd(r.ventas))}${kv('Aporte por unidad (precio − costo variable)',usd(r.contribucion))}<h4>Ganancia según lo que vendas</h4>${r.tabla.map(x=>kv(x.q+' unidades',usd(x.ganancia))).join('')}</div><p><small>El punto de equilibrio es la venta mínima donde no ganas ni pierdes: a partir de ahí, cada unidad extra es ganancia.</small></p>`});
b=`<div class="panel" id="ef"><div class="form">${fld('e1','Costos fijos mensuales ($)','300','Arriendo, internet, sueldos…')}${fld('e2','Precio de venta por unidad ($)','5')}${fld('e3','Costo variable por unidad ($)','3')}</div><div id="out"></div></div>`}
return `<h1 style="font-size:2rem">Calculadoras</h1><div class="tabs">${tabs.map(([k,l])=>`<a href="#/calculadoras/${k}" class="${k===t?'on':''}">${l}</a>`).join('')}</div>${b}<aside data-ad-slot="calc-1" hidden></aside>`};
const FAQ=[['¿Es gratis?','Sí: las calculadoras, el control de ventas y la lista de precios son gratuitas.'],['¿Dónde se guardan mis datos?','Solo en tu navegador. No se envían a ningún servidor. Si borras los datos del navegador, se pierden: usa el respaldo.'],['¿Sirve para facturar?','No. No es un sistema de facturación electrónica ni sustituye a un contador.'],['¿Margen o recargo?','El margen se calcula sobre el precio de venta; el recargo, sobre el costo. Un margen del 40 % equivale a un recargo del 66,7 %.']];
V.home=()=>{meta('Calcula tus precios y tus ganancias','Calcula tus precios, descubre tus ganancias y haz crecer tu negocio. Herramientas gratuitas para emprendedores de Ecuador.');
return `<section class="hero"><div><h1>Calcula tus precios, descubre tus ganancias y haz crecer tu negocio</h1><p class="sub">Sabe cuánto te cuesta cada producto, cuánto cobrar y cuánto te queda por venta. Sin saber de contabilidad.</p><p><a class="btn" href="#calc">Calcular mi precio</a> <a class="btn alt" href="#/calculadoras/ganancias">Explorar herramientas</a></p></div><div id="calc">${priceCalc()}</div></section>
<h2>Herramientas gratuitas</h2><div class="grid">${[['🏷️','Precio de venta','#/calculadoras/precio'],['📈','Ganancias','#/calculadoras/ganancias'],['⚖️','Punto de equilibrio','#/calculadoras/equilibrio'],['🧾','Control de ventas','#/ventas'],['📋','Lista de precios','#/lista']].map(t=>`<a class="card" href="${t[2]}"><div style="font-size:1.6rem">${t[0]}</div><h3>${t[1]}</h3></a>`).join('')}</div>

<h2>Preguntas frecuentes</h2>${FAQ.map(([q,a])=>`<details class="card" style="margin:8px 0"><summary><b>${q}</b></summary><p>${a}</p></details>`).join('')}`};
document.addEventListener('click',e=>{if(e.target.getAttribute?.('href')==='#calc'){e.preventDefault();$('#calc').scrollIntoView({behavior:'smooth'})}});
/* Control de ventas */
const DEF={productos:[],ventas:[],costos:[]};let ED=null,DB;
V.ventas=()=>{meta('Control de ventas','Registra productos, ventas y costos; consulta ganancias y exporta a CSV.');DB=store.get('pl_data',DEF);

const P=id=>DB.productos.find(p=>p.id===id)||{nombre:'(eliminado)',costo:0,precio:0},vs=DB.ventas.filter(v=>inR(v.fecha)),cs=DB.costos.filter(c=>inR(c.fecha));
const ing=vs.reduce((t,v)=>t+v.cant*v.precio,0),cp=vs.reduce((t,v)=>t+v.cant*P(v.pid).costo,0),gs=cs.reduce((t,c)=>t+c.monto,0),top={};vs.forEach(v=>top[v.pid]=(top[v.pid]||0)+v.cant);

return `<h1 style="font-size:2rem">Control de ventas</h1><p class="warn">Tus datos se guardan solo en este navegador. Si borras los datos del navegador, se pierden: descarga un respaldo con frecuencia.</p>

function bindV(){const sv=()=>{store.set('pl_data',DB);const a=$('#d1')?.value,b=$('#d2')?.value;app.innerHTML=V.ventas();$('#d1').value=a;$('#d2').value=b;bindV()},num=id=>Number(($('#'+id).value||'').replace(',','.'));
$('#fp').onsubmit=e=>{e.preventDefault();const o={id:ED||uid(),nombre:$('#pn').value.trim(),costo:num('pc'),precio:num('pp')};if(!(o.costo>=0)||!(o.precio>=0)||!o.nombre){alert('Revisa nombre, costo y precio (números no negativos).');return}const i=DB.productos.findIndex(p=>p.id===o.id);i>=0?DB.productos[i]=o:DB.productos.push(o);ED=null;sv()};
$('#fv').onsubmit=e=>{e.preventDefault();const p=DB.productos.find(x=>x.id===$('#vp').value),q=num('vq');if(!p||!(q>0)){alert('Agrega un producto y una cantidad mayor a 0.');return}DB.ventas.push({id:uid(),pid:p.id,cant:q,precio:p.precio,fecha:$('#vd').value||today()});sv()};
$('#fc').onsubmit=e=>{e.preventDefault();const m=num('cm');if(!(m>0)){alert('Ingresa un monto mayor a 0.');return}DB.costos.push({id:uid(),desc:$('#cd').value.trim(),monto:m,fecha:$('#cf').value||today()});sv()};
['d1','d2'].forEach(i=>$('#'+i).onchange=sv);
app.onclick=e=>{const a=e.target.dataset?.a,i=e.target.dataset?.i;if(!a)return;
if(a==='edit'){ED=i;sv()}else if(a==='cancel'){ED=null;sv()}else if(a==='delp'&&confirm('¿Eliminar producto?')){DB.productos=DB.productos.filter(p=>p.id!==i);sv()}else if(a==='delv'){DB.ventas=DB.ventas.filter(v=>v.id!==i);sv()}
else if(a==='csv'){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',P=id=>DB.productos.find(p=>p.id===id)||{nombre:'(eliminado)',costo:0};getFile('ventas.csv','Fecha,Producto,Cantidad,Precio,Costo unitario\n'+DB.ventas.map(v=>[v.fecha,q(P(v.pid).nombre),v.cant,v.precio,P(v.pid).costo].join(',')).join('\n')+'\n\nCostos,Descripción,Monto\n'+DB.costos.map(c=>[c.fecha,q(c.desc),c.monto].join(',')).join('\n'),'text/csv')}
else if(a==='bk')getFile('respaldo-preciolisto.json',JSON.stringify(DB),'application/json');
else if(a==='rs'){try{const o=JSON.parse($('#exp').value);if(!Array.isArray(o.productos)||!Array.isArray(o.ventas)||!Array.isArray(o.costos))throw 0;DB=o;sv()}catch(x){alert('Pega primero un respaldo JSON válido en el cuadro de texto.');$('#exp').hidden=false}}}}
/* Lista de precios */
V.lista=()=>{meta('Generador de listas de precios','Crea una lista de precios y compártela por WhatsApp o imprímela como PDF.');let L=store.get('pl_lista',{neg:'',items:[]});
setTimeout(()=>{const draw=()=>{const c={};L.items.forEach(i=>(c[i.cat||'General']=c[i.cat||'General']||[]).push(i));const fin=i=>i.precio*(1-(i.desc||0)/100);
$('#pv').innerHTML=`<h2 style="margin-top:0">${esc(L.neg)||'Tu negocio'} — Lista de precios</h2>${Object.entries(c).map(([k,a])=>`<h3>${esc(k)}</h3>${a.map(i=>`<div class="it"><div><b>${esc(i.nombre)}</b><br><small>${esc(i.d)}</small></div><div>${i.desc?`<s>${usd(i.precio)}</s> `:''}<b>${usd(fin(i))}</b></div></div>`).join('')}`).join('')||'<small>Agrega productos para ver la lista.</small>'}`;
$('#li').innerHTML=L.items.map((i,k)=>`<p>${esc(i.nombre)} ${usd(i.precio)} <button class="btn dng sm" data-k="${k}">Quitar</button></p>`).join('');store.set('pl_lista',L);
$('#wa').href='https://wa.me/?text='+encodeURIComponent((L.neg||'Lista de precios')+'\n'+L.items.map(i=>`• ${i.nombre}: ${usd(fin(i))}`).join('\n'))};
$('#ln').value=L.neg;$('#ln').oninput=()=>{L.neg=$('#ln').value;draw()};
$('#lf').onsubmit=e=>{e.preventDefault();const p=Number($('#lp').value.replace(',','.')),d=Number(($('#ld').value||'0').replace(',','.'));if(!$('#lm').value.trim()||!(p>=0)||!(d>=0&&d<100)){alert('Revisa nombre, precio (≥0) y descuento (0-99).');return}L.items.push({nombre:$('#lm').value.trim(),d:$('#lx').value,cat:$('#lc').value.trim(),precio:p,desc:d});e.target.reset();draw()};
$('#li').onclick=e=>{if(e.target.dataset.k!==undefined){L.items.splice(+e.target.dataset.k,1);draw()}};$('#pr').onclick=()=>window.print();draw()});
return `<h1 style="font-size:2rem">Lista de precios</h1><div class="cols"><div class="panel noprint"><label for="ln">Nombre de tu negocio</label><input id="ln"><form id="lf"><div class="form"><div><label for="lm">Producto</label><input id="lm"></div><div><label for="lx">Descripción</label><input id="lx"></div><div><label for="lc">Categoría</label><input id="lc"></div><div><label for="lp">Precio ($)</label><input id="lp" inputmode="decimal"></div><div><label for="ld">Descuento (%)</label><input id="ld" inputmode="decimal"></div></div><br><button class="btn">Agregar</button></form><div id="li"></div></div><div><div class="pl" id="pv"></div><p class="noprint"><button class="btn" id="pr">Imprimir / guardar PDF</button> <a class="btn alt" id="wa" target="_blank" rel="noopener">Compartir por WhatsApp</a></p></div></div>`};
V.plantillas=()=>{meta('Plantillas para emprendedores','Plantillas de Excel para precios, ingresos, inventario y ganancias.');
return `<h1 style="font-size:2rem">Plantillas</h1><p class="warn">Las plantillas están en preparación y aún no se pueden comprar ni descargar. La pasarela de pagos no está configurada.</p><div class="grid">${['Plantilla Excel para calcular precios de venta','Control de ingresos y gastos','Plantilla de inventario','Pack de administración básica','Cálculo de ganancias mensuales'].map(n=>`<div class="card"><span class="tag">De pago · próximamente</span><h3>${n}</h3><p><small>Precio de prueba previsto: ${n.startsWith('Pack')?'$6,99':'$3,99'}</small></p></div>`).join('')}</div><p>Mientras tanto, usa las <a href="#/calculadoras/precio">calculadoras gratuitas</a>.</p>`};
const ART={'calcular-precio-de-venta':['Cómo calcular el precio de venta de un producto','Suma todos los costos por unidad: compra o fabricación, empaque, transporte y otros. Ejemplo: $8 + $1 + $0,50 + $0,50 = $10.<br><br>Si quieres ganar 40 % del precio, divide entre (1 − 0,40): $10 / 0,60 = $16,67. Si además cobras 10 % de comisión, divides entre (1 − 0,40 − 0,10) = $20.'],'margen-vs-recargo':['Margen y recargo: la confusión que te cuesta dinero','El margen se calcula sobre el precio de venta; el recargo, sobre el costo. Si compras a $10 y vendes a $16,67, ganas $6,67: es 40 % de margen pero 66,7 % de recargo. Si aplicas 40 % de recargo ($14), tu margen real es solo 28,6 %.']};
V.guias=()=>{meta('Guías para emprendedores','Guías prácticas sobre precios y ganancias.');return `<h1 style="font-size:2rem">Guías para emprendedores</h1><div class="grid">${Object.entries(ART).map(([k,a])=>`<a class="card" href="#/guia/${k}"><h3>${a[0]}</h3></a>`).join('')}</div><p><small>Más guías en preparación.</small></p>`};
V.guia=k=>{const a=ART[k];if(!a)return V.nf();meta(a[0],a[1].replace(/<[^>]+>/g,' ').slice(0,150));return `<article><h1 style="font-size:2rem">${a[0]}</h1><p>${a[1]}</p><p><a class="btn" href="#/calculadoras/precio">Calcular mi precio</a></p></article>`};
V.planes=()=>{meta('Planes y precios','Plan gratuito y plan premium futuro.');return `<h1 style="font-size:2rem">Planes y precios</h1><div class="grid"><div class="card"><span class="tag">Disponible</span><h3>Gratis</h3><p>Calculadoras, control de ventas y listas de precios, con datos en tu navegador.</p></div><div class="card"><span class="tag">No disponible</span><h3>Premium</h3><p>Cuentas y sincronización en la nube: en evaluación. Aún no se vende.</p></div></div>`};
V.privacidad=()=>{meta('Privacidad','Cómo se almacenan tus datos.');return `<h1 style="font-size:2rem">Privacidad</h1><p>PrecioListo no pide cédula, RUC ni datos bancarios. Lo que ingresas se guarda solo en el almacenamiento local de tu navegador y no se envía a servidores. Si borras los datos del navegador, se pierde: exporta respaldos. Si en el futuro se activan anuncios o analítica, se informará aquí.</p>`};
V.terminos=()=>{meta('Términos de uso','Condiciones de uso.');return `<h1 style="font-size:2rem">Términos de uso</h1><p>Los resultados son estimaciones para apoyar decisiones de precio. PrecioListo no es un sistema de facturación electrónica, no brinda asesoría contable ni tributaria y no sustituye a un contador. Verifica obligaciones tributarias en el SRI.</p>`};
V.nf=()=>{meta('No encontrado','');return `<h1>Página no encontrada</h1><a class="btn" href="#/">Volver al inicio</a>`};
function render(){$('#nav').classList.remove('open');const [r,...p]=(location.hash.slice(2)||'home').split('/');try{app.innerHTML=(V[r]||V.nf)(p.join('/'));app.onclick=null;if(r==='ventas'){}}catch(e){app.innerHTML='<h1>Ups, algo salió mal</h1><a class="btn" href="#/">Volver</a>';console.error(e)}
document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.hash.split('/')[1]===r));scrollTo(0,0)}
addEventListener('hashchange',render);$('#burger').onclick=e=>{e.target.setAttribute('aria-expanded',$('#nav').classList.toggle('open'))};render();
